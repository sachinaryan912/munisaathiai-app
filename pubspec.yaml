name: munisaathiai
description: "Muni Saathi AI — AI-powered monitoring and implementation-tracking platform for the Muni Model."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI / animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  lucide_icons_flutter: ^3.0.4
  flutter_markdown_plus: ^1.0.3
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Files / media
  file_picker: ^8.1.4
  intl: ^0.19.0
  path_provider: ^2.1.5
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/muni_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/muni_logo.png"
